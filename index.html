    textarea { width: 100%; height: 100px; font-size: 18px; padding: 12px; border: 0.5px solid #e4e2f0; border-radius: 8px; font-family: 'Inter', Arial, sans-serif; resize: vertical; background: #fafaf9; color: #1c1917; }

    .text-toolbar {
  display: flex;
  gap: 8px;
  margin-bottom: 16px;
  flex-wrap: wrap;
}
.btn-secondary { font-size: 12px; padding: 6px 12px; background: white; color: #78716c; border: 0.5px solid #e4e2f0; border-radius: 7px; cursor: pointer; font-weight: 500; font-family: 'Inter', sans-serif; }
.btn-secondary:hover { background: #fafaf9; }
.portions-nav { display: none; align-items: center; gap: 6px; }

.portions-label { font-size: 11px; color: #a8a29e; font-weight: 500; white-space: nowrap; }
.btn-portion { font-size: 11px; padding: 4px 8px; border: 0.5px solid #e4e2f0; border-radius: 6px; cursor: pointer; background: white; color: #78716c; font-family: 'Inter', sans-serif; }
.btn-portion.active { background: #6366f1; color: white; border-color: #6366f1; }
.translation-text {
  font-size: 17px;
  line-height: 1.9;
  color: #2c2c2a;
  display: none;
  white-space: pre-wrap;
}
.translation-text.visible { display: block; }
    .he-text {
      font-size: 22px;
      line-height: 1.9;
      color: #2c2c2a;
    }

    }

    .word:hover { background: #faeeda; }

    /* PANNEAU LATÉRAL */

.panel-close:hover { background: #444; }

    .panel-he-row { display: flex; align-items: center; gap: 10px; margin-bottom: 4px; }
    .panel-he {

      color: #2c2c2a;

    .panel-fr-row .panel-fr { margin-bottom: 0; }

    .btn-star:hover { color: #f59e0b; background: #fef3c7; }

    .panel-fr {

        <option value="ja" disabled>Japonais</option>
        <option value="zh" disabled>Chinois</option>
      </select>
    </div>
    <span class="lang-sep">→</span>

      <span class="lang-sel-label">Je traduis en</span>

function decoupeTexte(texte) {
  const mots = texte.trim().split(/\s+/);
  if (mots.length <= 150) return [texte];
  const result = [];
  let debut = 0;
  while (debut < mots.length) {
    let fin = Math.min(debut + 150, mots.length);
    if (fin < mots.length) {
      for (let i = fin; i > debut + 120; i--) {
        if (mots[i-1] && mots[i-1].endsWith('.')) { fin = i; break; }
      }
    }
    result.push(mots.slice(debut, fin).join(' '));
    debut = fin;
  }
  return result;
}

  async function afficherConjugaisons(infinitif) {
    const panel = document.getElementById('conjPanel');
    document.getElementById('conj-infinitif').textContent = infinitif;
    document.getElementById('conj-contenu').innerHTML = '<div class="panel-loading">Chargement des conjugaisons...</div>';
    panel.classList.add('open');

    try {
      const response = await fetch('/api/conjugaison', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ verbe: infinitif, langueApprise: getLangues().langueApprise })
      });
      if (!response.ok) { const t = await response.text(); throw new Error('Erreur serveur : ' + t.substring(0, 500)); }
      if (!(response.headers.get('content-type') || '').includes('application/json')) { const t = await response.text(); throw new Error('Réponse non-JSON : ' + t.substring(0, 500)); }
      const data = await response.json();
      if (data.error) throw new Error(data.error);

      const pronoms = [
        { lm: 'אני / Je',        lf: 'אני / Je',        lg: 'Je',          m: 'ani_m',     f: 'ani_f' },
        { lm: 'אתה / Tu (m)',     lf: 'את / Tu (f)',     lg: 'Tu',          m: 'ata',       f: 'at' },
        { lm: 'הוא / Il',         lf: 'היא / Elle',      lg: 'Il / Elle',   m: 'hou',       f: 'hi' },
        { lm: 'אנחנו / Nous',     lf: 'אנחנו / Nous',    lg: 'Nous',        m: 'anahnou_m', f: 'anahnou_f' },
        { lm: 'אתם / Vous (m)',   lf: 'אתן / Vous (f)',  lg: 'Vous',        m: 'atem',      f: 'aten' },
        { lm: 'הם / Ils',         lf: 'הן / Elles',      lg: 'Ils / Elles', m: 'hem',       f: 'hen' },
      ];

      const isHebrew = getLangues().langueApprise === 'he';
      const isRTLConj = RTL_LANGS.has(getLangues().langueApprise);
      const thF = isHebrew ? 'Féminin / נקבה' : 'Féminin';
      const thM = isHebrew ? 'Masculin / זכר' : 'Masculin';
      const titlePresent = isHebrew ? 'Présent / הווה' : 'Présent';
      const titlePasse   = isHebrew ? 'Passé / עבר'   : 'Passé';
      const titleFutur   = isHebrew ? 'Futur / עתיד'  : 'Futur';

      // Detect gender: any tense with non-empty m ≠ f → gendered
      const allTenses = [data.present, data.passe, data.futur];
      const gendered = allTenses.some(temps =>
        pronoms.some(p => {
          const m = (temps[p.m] || '').trim();
          const f = (temps[p.f] || '').trim();
          return m && f && m !== f;
        })
      );

      // Strip Hebrew prefix "XX / " from bilingual pronom labels for LTR display
      const stripHe = s => s.replace(/^[^ ]+ \/ /, '');

      function buildTable(temps) {
        const d = srcDirStyle();

        if (!gendered) {
          // Single "Forme" column — merge m and f
          const rows = pronoms.map(p => {
            const val = (temps[p.m] || temps[p.f] || '').trim();
            return isRTLConj
              ? `<tr><td class="conj-m" ${d}>${val}</td><td class="conj-pronoun" ${d}>${p.lg}</td></tr>`
              : `<tr><td class="conj-pronoun" ${d}>${p.lg}</td><td class="conj-m" ${d}>${val}</td></tr>`;
          }).join('');
          const thead = isRTLConj
            ? `<tr><th>Forme</th><th></th></tr>`
            : `<tr><th></th><th>Forme</th></tr>`;
          return `<table class="conj-table"><thead>${thead}</thead><tbody>${rows}</tbody></table>`;
        }

        // Gendered — pronom label: Hebrew+French for RTL, French-only for LTR
        const rows = pronoms.map(p => {
          const mVal = temps[p.m] || '';
          const fVal = temps[p.f] || '';
          const pronLabel = isRTLConj
            ? `${p.lm}<br><span class="conj-pronoun-f">${p.lf}</span>`
            : `${stripHe(p.lm)}<br><span class="conj-pronoun-f">${stripHe(p.lf)}</span>`;
          return isRTLConj
            ? `<tr><td class="conj-f" ${d}>${fVal}</td><td class="conj-m" ${d}>${mVal}</td><td class="conj-pronoun" ${d}>${pronLabel}</td></tr>`
            : `<tr><td class="conj-pronoun" ${d}>${pronLabel}</td><td class="conj-m" ${d}>${mVal}</td><td class="conj-f" ${d}>${fVal}</td></tr>`;
        }).join('');
        const thead = isRTLConj
          ? `<tr><th>${thF}</th><th>${thM}</th><th></th></tr>`
          : `<tr><th></th><th>${thM}</th><th>${thF}</th></tr>`;
        return `<table class="conj-table"><thead>${thead}</thead><tbody>${rows}</tbody></table>`;
      }

      document.getElementById('conj-contenu').innerHTML = `
        <div class="conj-section-title">${titlePresent}</div>
        ${buildTable(data.present)}
        <div class="conj-section-title">${titlePasse}</div>
        ${buildTable(data.passe)}
        <div class="conj-section-title">${titleFutur}</div>
        ${buildTable(data.futur)}
      `;
    } catch (err) {
      document.getElementById('conj-contenu').innerHTML =
        `<div class="panel-loading">❌ Erreur : ${err.message}</div>`;
    }
  }

function renderParallel({ source, cible }) {
  let srcHtml   = '';
  let cibleHtml = '';

  source.forEach(tok => {
    if (tok.t === '\n') { srcHtml += '<br>'; return; }
    if (tok.g != null) {
      srcHtml += '<span class="seg" data-g="' + tok.g + '" data-side="src"'
        + ' onmouseenter="onSegHover(this)" onmouseleave="onParallelMouseleave()"'
        + ' onclick="onClickSrc(this)">' + tok.t + '</span> ';
    } else {
      // null-g source tokens: clickable for detail panel, no cross-highlight
      srcHtml += '<span class="seg" onclick="onClickSrc(this)">' + tok.t + '</span> ';
    }
  });

  cible.forEach(tok => {
    if (tok.t === '\n') { cibleHtml += '<br>'; return; }
    if (tok.g != null) {
      cibleHtml += '<span class="seg" data-g="' + tok.g + '" data-side="cible"'
        + ' onmouseenter="onSegHover(this)" onmouseleave="onParallelMouseleave()"'
        + ' onclick="onClickCible(this)">' + tok.t + '</span> ';
    } else {
      cibleHtml += '<span class="seg-null">' + tok.t + '</span> ';
    }
  });

  document.getElementById('parallelHe').innerHTML   = srcHtml;
  document.getElementById('parallelFr').innerHTML   = cibleHtml;
}

// ── Parallel scroll helpers ───────────────────────────────────────────────────

let hoverScrollTimer = null;
let syncLock = false;
let syncRafId = null;
const isMobile = () => window.innerWidth <= 700;

function isVisibleInCol(el, col) {
  const cr = col.getBoundingClientRect();
  const er = el.getBoundingClientRect();
  return er.top >= cr.top - 8 && er.bottom <= cr.bottom + 8;
}

function scrollToUpperThird(el, col) {
  const cr = col.getBoundingClientRect();
  const er = el.getBoundingClientRect();
  col.scrollTo({
    top: Math.max(0, er.top - cr.top + col.scrollTop - col.clientHeight * 0.25),
    behavior: 'smooth'
  });
}

// Scroll the OTHER column so the correspondent of g lands in view (if not already)
function scrollCorrespondentIntoView(g, side) {
  if (!g) return;
  const otherSide = side === 'src' ? 'cible' : 'src';
  const peer = document.querySelector('.seg[data-g="' + g + '"][data-side="' + otherSide + '"]');
  if (!peer) return;
  const col = peer.closest('.parallel-col');
  if (!col || isVisibleInCol(peer, col)) return;
  scrollToUpperThird(peer, col);
}

// Anchor-based sync: scroll dstCol to match what srcCol is showing
function syncScrollFrom(srcCol, dstCol) {
  const srcRect = srcCol.getBoundingClientRect();
  let anchor = null;
  for (const seg of srcCol.querySelectorAll('.seg[data-g]')) {
    const r = seg.getBoundingClientRect();
    if (r.top < srcRect.bottom && r.bottom > srcRect.top) { anchor = seg; break; }
  }
  if (!anchor) return;
  const g = anchor.dataset.g;
  const dstSide = dstCol.id === 'parallelHe' ? 'src' : 'cible';
  const peer = dstCol.querySelector('.seg[data-g="' + g + '"][data-side="' + dstSide + '"]');
  if (!peer) return;
  const anchorOffset = anchor.getBoundingClientRect().top - srcRect.top;
  const peerOffset   = peer.getBoundingClientRect().top - dstCol.getBoundingClientRect().top;
  dstCol.scrollTop += peerOffset - anchorOffset;
}

function setupParallelSync() {
  function makeHandler(srcId, dstId) {
    return function () {
      if (syncLock || isMobile()) return;
      if (syncRafId) cancelAnimationFrame(syncRafId);
      syncRafId = requestAnimationFrame(function () {
        syncLock = true;
        syncScrollFrom(document.getElementById(srcId), document.getElementById(dstId));
        setTimeout(function () { syncLock = false; }, 50);
      });
    };
  }
  document.getElementById('parallelHe').addEventListener('scroll', makeHandler('parallelHe', 'parallelFr'));
  document.getElementById('parallelFr').addEventListener('scroll', makeHandler('parallelFr', 'parallelHe'));
}

// ── Segment event handlers ────────────────────────────────────────────────────

function onSegHover(el) {
  if (activeClickG !== null) return;
  highlightGroup(el.dataset.g, el);
  clearTimeout(hoverScrollTimer);
  hoverScrollTimer = setTimeout(function () {
    scrollCorrespondentIntoView(el.dataset.g, el.dataset.side);
  }, 80);
}

function onParallelMouseleave() {
  if (activeClickG !== null) return;
  clearHL();
}

function onClickSrc(el) {
  const g = el.dataset.g != null ? el.dataset.g : null;
  activeClickG = g;
  highlightGroup(g, el);
  motDetailCourant = el.textContent.trim();
  document.getElementById('detailBar').classList.add('visible');
  scrollCorrespondentIntoView(g, 'src');
}

function onClickCible(el) {
  const g = el.dataset.g != null ? el.dataset.g : null;
  activeClickG = g;
  highlightGroup(g, el);
  const srcSpan = g ? document.querySelector('.seg[data-g="' + g + '"][data-side="src"]') : null;
  motDetailCourant = srcSpan ? srcSpan.textContent.trim() : null;
  if (motDetailCourant) document.getElementById('detailBar').classList.add('visible');
  else document.getElementById('detailBar').classList.remove('visible');
  scrollCorrespondentIntoView(g, 'cible');
}

async function ouvrirDetail() {
  if (!motDetailCourant) return;
  document.getElementById('panel-mot').textContent = motDetailCourant;
  document.getElementById('panel-traduction').textContent = '';
  document.getElementById('panel-badges').innerHTML = '';
  document.getElementById('panel-contenu').innerHTML = '<div class="panel-loading">Analyse en cours...</div>';
  document.getElementById('btnStar').style.display = 'none';
  favoriId = null;
  document.getElementById('sidePanel').classList.add('open');
  const texteComplet = document.getElementById('parallelHe').innerText;
  try {
    const response = await fetch('/api/translate', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ mot: motDetailCourant, texte: texteComplet, type: 'mot', ...getLangues() })
    });
    if (!response.ok) { const t = await response.text(); throw new Error('Erreur serveur : ' + t.substring(0, 500)); }
    if (!(response.headers.get('content-type') || '').includes('application/json')) { const t = await response.text(); throw new Error('Réponse non-JSON : ' + t.substring(0, 500)); }
    const data = await response.json();
    const texteReponse = data.content[0].text.replace(/```json|```/g, '').trim();
    const json = JSON.parse(texteReponse);
    document.getElementById('panel-traduction').textContent = json.traduction;
    document.getElementById('panel-badges').innerHTML = json.badges.map(b => '<span class="badge">' + b + '</span>').join('');
    const btnConj = json.estVerbe && json.infinitif ? '<button class="btn-conjugaison" onclick="afficherConjugaisons(\'' + json.infinitif.replace(/'/g, "\\'") + '\')"><i class="ti ti-layout-grid"></i> Conjugaisons →</button>' : '';
    const niqqud = json.motAvecNiqqud ? '<div class="panel-niqqud" ' + srcDirStyle() + '>' + json.motAvecNiqqud + '</div><div class="divider"></div>' : '';
    const racineLabel = SEMITIC_LANGS.has(getLangues().langueApprise) ? 'Racine' : 'Étymologie';
    document.getElementById('panel-contenu').innerHTML = niqqud + '<div class="panel-label">' + racineLabel + '</div><div class="panel-val">' + json.racine + '</div><div class="panel-label">Analyse</div><div class="panel-val">' + json.analyse + '</div>' + btnConj;

    document.getElementById('btnStar').style.display = '';
    detailCourant = { mot: motDetailCourant, traduction: json.traduction, racine: json.racine };
    _chargerFavori(motDetailCourant);
    _ajouterHistorique(motDetailCourant, json.traduction);
  } catch (err) {
    document.getElementById('panel-contenu').innerHTML = '<div class="panel-loading">❌ Erreur : ' + err.message + '</div>';
  }
}

function afficherPopup(msg) {
  document.getElementById('popupMsg').textContent = msg;
  document.getElementById('popupOverlay').classList.add('visible');
}
function fermerPopup() {
  document.getElementById('popupOverlay').classList.remove('visible');
}

function prononcerMot() {
  const mot = document.getElementById('panel-mot').textContent.trim();
  if (!mot || !window.speechSynthesis) return;
  const utt = new SpeechSynthesisUtterance(mot);
  utt.lang = 'he-IL';
  window.speechSynthesis.cancel();
  window.speechSynthesis.speak(utt);
}

// ── FAVORIS & HISTORIQUE ──────────────────────────────────────────────────────

async function _chargerFavori(mot) {
  favoriId = null;
  _syncEtoile();
  const { data: { user } } = await supabaseClient.auth.getUser();
  if (!user) return;
  const { data } = await supabaseClient.from('favoris')
    .select('id')
    .eq('mot_hebreu', mot)
    .eq('user_id', user.id)
    .maybeSingle();
  favoriId = data?.id ?? null;
  _syncEtoile();
}

function _syncEtoile() {
  const btn = document.getElementById('btnStar');
  if (!btn) return;
  btn.textContent = favoriId ? '★' : '☆';
  btn.classList.toggle('active', !!favoriId);
  btn.title = favoriId ? 'Retirer des favoris' : 'Ajouter aux favoris';
}

async function basculerFavori() {
  const { data: { user } } = await supabaseClient.auth.getUser();
  if (!user) { ouvrirModalAuth(); return; }
  if (!detailCourant) return;
  if (favoriId) {
    await supabaseClient.from('favoris').delete().eq('id', favoriId);
    favoriId = null;
  } else {
    const { data } = await supabaseClient.from('favoris')
      .insert({ mot_hebreu: detailCourant.mot, traduction: detailCourant.traduction, racine: detailCourant.racine, user_id: user.id })
      .select('id')
      .single();
    favoriId = data?.id ?? null;
  }
  _syncEtoile();
}

async function _ajouterHistorique(mot, traduction) {
  const { data: { user } } = await supabaseClient.auth.getUser();
  if (!user) return;
  await supabaseClient.from('historique').insert({ mot_hebreu: mot, traduction, user_id: user.id });
}

// ── AUTH ──────────────────────────────────────────────────────────────────────

let authMode = 'login';

function ouvrirModalAuth() {
  authMode = 'login';
  _syncModale();
  document.getElementById('authEmail').value = '';
  document.getElementById('authPassword').value = '';
  document.getElementById('authMsg').textContent = '';
  document.getElementById('authMsg').className = 'auth-msg';
  document.getElementById('authModalOverlay').classList.add('visible');
  setTimeout(() => document.getElementById('authEmail').focus(), 50);
}

function fermerModalAuth() {
  document.getElementById('authModalOverlay').classList.remove('visible');
}

function basculerModeAuth() {
  authMode = authMode === 'login' ? 'signup' : 'login';
  _syncModale();
  document.getElementById('authMsg').textContent = '';
  document.getElementById('authMsg').className = 'auth-msg';
}

function _syncModale() {
  const login = authMode === 'login';
  document.getElementById('authTitle').textContent = login ? 'Se connecter' : 'Créer un compte';
  document.getElementById('authSubtitle').textContent = login
    ? 'Accédez à vos favoris et votre historique.'
    : 'Créez votre compte pour sauvegarder vos mots.';
  document.getElementById('authSubmitBtn').textContent = login ? 'Se connecter' : 'Créer mon compte';
  document.getElementById('authToggle').innerHTML = login
    ? 'Pas encore de compte ? <a href="#" onclick="basculerModeAuth();return false;">Créer un compte</a>'
    : 'Déjà un compte ? <a href="#" onclick="basculerModeAuth();return false;">Se connecter</a>';
}

async function soumettreAuth() {
  const email = document.getElementById('authEmail').value.trim();
  const password = document.getElementById('authPassword').value;
  const msgEl = document.getElementById('authMsg');
  const btn = document.getElementById('authSubmitBtn');

  if (!email || !password) {
    msgEl.className = 'auth-msg error';
    msgEl.textContent = 'Email et mot de passe requis.';
    return;
  }

  btn.disabled = true;
  btn.textContent = '…';
  msgEl.textContent = '';

  const isSignup = authMode === 'signup';
  const { error } = isSignup
    ? await supabaseClient.auth.signUp({ email, password })
    : await supabaseClient.auth.signInWithPassword({ email, password });

  btn.disabled = false;
  _syncModale();

  if (error) {
    msgEl.className = 'auth-msg error';
    msgEl.textContent = _traduireErreurAuth(error.message);
    return;
  }

  if (isSignup) {
    msgEl.className = 'auth-msg success';
    msgEl.textContent = 'Compte créé ! Vérifiez votre email pour confirmer.';
    return;
  }

  fermerModalAuth();
}

function _traduireErreurAuth(msg) {
  if (msg.includes('Invalid login credentials')) return 'Email ou mot de passe incorrect.';
  if (msg.includes('Email not confirmed')) return 'Confirmez votre email avant de vous connecter.';
  if (msg.includes('User already registered')) return 'Un compte existe déjà avec cet email.';
  if (msg.includes('Password should be at least')) return 'Le mot de passe doit faire au moins 6 caractères.';
  return msg;
}

async function seDeconnecter() {
  await supabaseClient.auth.signOut();
}

function _mettreAJourHeaderAuth(user) {
  const btnConnexion = document.getElementById('btnConnexion');
  const userChip = document.getElementById('userChip');
  if (user) {
    btnConnexion.style.display = 'none';
    userChip.style.display = 'flex';
    document.getElementById('userEmail').textContent = user.email;
  } else {
    btnConnexion.style.display = '';
    userChip.style.display = 'none';
  }
}

supabaseClient.auth.onAuthStateChange((_event, session) => {
  _mettreAJourHeaderAuth(session?.user ?? null);
});

// ── Language helpers ──────────────────────────────────────────────────────────
function getLangues() {
  return {
    langueApprise: document.getElementById('langApprise')?.value || 'he',
    langueNative:  document.getElementById('langNative')?.value  || 'fr'
  };
}

// ── Language selectors ────────────────────────────────────────────────────────
const RTL_LANGS    = new Set(['he', 'ar', 'fa']);
const SEMITIC_LANGS = new Set(['he', 'ar']);

const LANG_FR_NAMES = {
  he: 'hébreu', en: 'anglais', es: 'espagnol', de: 'allemand',
  it: 'italien', pt: 'portugais', ar: 'arabe', fa: 'persan',
  ru: 'russe', ja: 'japonais', zh: 'chinois', fr: 'français'
};

const LANG_PLACEHOLDERS = {
  he: 'הדבק כאן טקסט בעברית...',
  en: 'Paste your text here...',
  es: 'Pega tu texto aquí...',
  de: 'Füge deinen Text hier ein...',
  it: 'Incolla il tuo testo qui...',
  pt: 'Cole o seu texto aqui...',
  ar: 'الصق النص هنا...',
  fa: 'متن خود را اینجا جای‌گذاری کنید...',
  ru: 'Вставьте текст сюда...',
  ja: 'ここにテキストを貼り付けてください...',
  zh: '在此粘贴文本...',
};

function applyLangSettings() {
  const apprise = document.getElementById('langApprise').value;
  const isRTL = RTL_LANGS.has(apprise);
  const dir   = isRTL ? 'rtl' : 'ltr';
  const align = isRTL ? 'right' : 'left';

  function applyDir(el) {
    if (!el) return;
    el.style.direction = dir;
    el.style.textAlign = align;
  }

  // Textarea de saisie
  const textarea = document.getElementById('input');
  if (textarea) {
    applyDir(textarea);
    textarea.placeholder = LANG_PLACEHOLDERS[apprise] || '...';
  }
  // Zone de lecture (texte analysé)
  applyDir(document.getElementById('output'));
  // Mot affiché dans le panneau de détail
  applyDir(document.getElementById('panel-mot'));
  // Infinitif dans le panneau de conjugaison
  applyDir(document.getElementById('conj-infinitif'));

  const inputLabel = document.querySelector('.input-label');
  const nom = LANG_FR_NAMES[apprise] || apprise;
  if (inputLabel) inputLabel.textContent = `Colle ton texte en ${nom}`;
}

// Retourne un attribut style inline pour les éléments créés dynamiquement
function srcDirStyle() {
  const isRTL = RTL_LANGS.has(getLangues().langueApprise);
  return isRTL
    ? 'style="direction:rtl;text-align:right"'
    : 'style="direction:ltr;text-align:left"';
}

function onLangChange() {
  const apprise = document.getElementById('langApprise').value;
  const native  = document.getElementById('langNative').value;
  localStorage.setItem('lamed_lang_apprise', apprise);
  localStorage.setItem('lamed_lang_native', native);
  applyLangSettings();
}

(function initLangSelectors() {
  const savedApprise = localStorage.getItem('lamed_lang_apprise') || 'he';
  const savedNative  = localStorage.getItem('lamed_lang_native')  || 'fr';
  const selApprise = document.getElementById('langApprise');
  const selNative  = document.getElementById('langNative');
  if (selApprise) selApprise.value = savedApprise;
  if (selNative)  selNative.value  = savedNative;
  applyLangSettings();
  setupParallelSync();
})();

</script>
