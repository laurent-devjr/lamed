  display: flex;

}
.btn-secondary { font-size: 12px; padding: 6px 12px; background: white; color: #78716c; border: 0.5px solid #e4e2f0; border-radius: 7px; cursor: pointer; font-weight: 500; font-family: 'Inter', sans-serif; }

.translation-text {

<script>
  let motActif = null;
  let segmentsData = null;
  let motDetailCourant = null;
  let favoriId = null;
  let detailCourant = null;

  async function ocrPhoto(input) {
    const file = input.files[0];
    if (!file) return;
    input.value = '';

    const textarea = document.getElementById('input');
    textarea.value = '';
    textarea.disabled = true;
    document.getElementById('analyseSpinnerLabel').textContent = 'Lecture du fichier en cours...';
    document.getElementById('analyseSpinner').classList.add('visible');

    const isDocx = file.name.endsWith('.docx') ||
      file.type === 'application/vnd.openxmlformats-officedocument.wordprocessingml.document';

    try {
      if (isDocx) {
        const arrayBuffer = await file.arrayBuffer();
        const result = await mammoth.extractRawText({ arrayBuffer });
        textarea.value = result.value;
      } else {
        const mediaType = file.type || (file.name.endsWith('.pdf') ? 'application/pdf' : 'image/jpeg');
        const base64 = await new Promise((resolve, reject) => {
          const reader = new FileReader();
          reader.onload = e => resolve(e.target.result.split(',')[1]);
          reader.onerror = reject;
          reader.readAsDataURL(file);
        });
        const res = await fetch('/api/ocr', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ image: base64, mediaType })
        });
        const data = await res.json();
        if (data.error) throw new Error(data.error);
        textarea.value = data.texte.replace(/\\n/g, '\n');
      }
    } catch (err) {
      textarea.value = '';
      alert('Erreur lors de la lecture : ' + err.message);
    } finally {
      textarea.disabled = false;
      textarea.focus();
      document.getElementById('analyseSpinner').classList.remove('visible');
    }
  }

  function afficherTexte() {
    const texte = document.getElementById('input').value.trim();
    if (!texte) return;

    document.getElementById('analyseSpinnerLabel').textContent = 'Analyse en cours...';
    document.getElementById('analyseSpinner').classList.add('visible');

    requestAnimationFrame(() => {
      // Nettoie les niqqoud
      const textePropre = texte.replace(/[\u0591-\u05C7]/g, '');
      const lignes = textePropre.split(/\n/);

      const output = document.getElementById('output');
      output.innerHTML = lignes.map(ligne => {
        const mots = ligne.trim().split(/\s+/).filter(m => m);
        if (!mots.length) return '<br>';
        return mots.map(mot =>
          `<span class="word" onclick="traduire(this, '${mot.replace(/'/g, "\\'")}')">${mot}</span>`
        ).join(' ');
      }).join('<br>');

      document.getElementById('analyseSpinner').classList.remove('visible');
      document.getElementById('inputCard').style.display = 'none';
      document.getElementById('textCard').classList.add('visible');
    });
  }

  async function traduire(el, mot) {
    if (motActif) motActif.classList.remove('active');
    motActif = el;
    el.classList.add('active');

    // Ouvre le panneau
    document.getElementById('panel-mot').textContent = mot;
    document.getElementById('panel-traduction').textContent = '';
    document.getElementById('panel-badges').innerHTML = '';
    document.getElementById('panel-contenu').innerHTML = '<div class="panel-loading">Analyse en cours...</div>';
    document.getElementById('btnStar').style.display = 'none';
    favoriId = null;
    document.getElementById('sidePanel').classList.add('open');

    const texteComplet = document.getElementById('output').innerText;

    try {
      const response = await fetch('/api/translate', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ mot, texte: texteComplet, type: 'mot' })
      });

      const data = await response.json();
      const texteReponse = data.content[0].text.replace(/```json|```/g, '').trim();
      const json = JSON.parse(texteReponse);

      document.getElementById('panel-traduction').textContent = json.traduction;
      document.getElementById('panel-badges').innerHTML = json.badges
        .map(b => `<span class="badge">${b}</span>`).join('');

      const btnConj = json.estVerbe && json.infinitif
        ? `<button class="btn-conjugaison" onclick="afficherConjugaisons('${json.infinitif.replace(/'/g, "\\'")}')"><i class="ti ti-layout-grid"></i> Conjugaisons →</button>`
        : '';

      const niqqud = json.motAvecNiqqud
        ? `<div class="panel-niqqud">${json.motAvecNiqqud}</div><div class="divider"></div>`
        : '';

      document.getElementById('panel-contenu').innerHTML = `
        ${niqqud}
        <div class="panel-label">Racine</div>
        <div class="panel-val">${json.racine}</div>
        <div class="panel-label">Analyse</div>
        <div class="panel-val">${json.analyse}</div>
        ${btnConj}
      `;

      document.getElementById('btnStar').style.display = '';
      detailCourant = { mot, traduction: json.traduction, racine: json.racine };
      _chargerFavori(mot);
      _ajouterHistorique(mot, json.traduction);

    } catch (err) {
      document.getElementById('panel-contenu').innerHTML =
        `<div class="panel-loading">❌ Erreur : ${err.message}</div>`;
    }
  }
let traductionChargee = false;
let modeTraduction = false;
let colonnesInverties = false;
let portions = [];
let portionActive = 0;

function decoupeTexte(texte) {
  const mots = texte.trim().split(/\s+/);
  if (mots.length <= 150) return [texte];
  const result = [];
  let debut = 0;
  while (debut < mots.length) {
    let fin = Math.min(debut + 150, mots.length);
    if (fin < mots.length) {
      for (let i = fin; i > debut + 120; i--) {
        if (mots[i-1] && mots[i-1].endsWith('.')) { fin = i; break; }
      }
    }
    result.push(mots.slice(debut, fin).join(' '));
    debut = fin;
  }
  return result;
}

function afficherBoutonsPortion() {
  const nav = document.getElementById('portionsNav');
  const btns = document.getElementById('portionsBtns');
  btns.innerHTML = portions.map((_, i) =>
    `<button class="btn-portion ${i === portionActive ? 'active' : ''}" onclick="chargerPortion(${i})">${i + 1}</button>`
  ).join('');
  nav.classList.add('visible');
}

async function chargerPortion(idx) {
  portionActive = idx;
  traductionChargee = false;
  segmentsData = null;
  document.getElementById('parallelHe').innerHTML = '';
  document.getElementById('parallelFr').innerHTML = '';
  document.getElementById('detailBar').classList.remove('visible');
  afficherBoutonsPortion();
  await lancerTraduction(portions[idx]);
}

async function lancerTraduction(texte) {
  const parallelView = document.getElementById('parallelView');
  parallelView.classList.add('visible');
  const toolbarRect = document.querySelector('.text-toolbar').getBoundingClientRect();
  parallelView.style.top = toolbarRect.bottom + 8 + 'px';
  const cardRect = document.getElementById('textCard').getBoundingClientRect();
  parallelView.style.left = cardRect.left + 'px';
  parallelView.style.right = (window.innerWidth - cardRect.right) + 'px';
  parallelView.style.borderRadius = '0 0 12px 12px';
  document.getElementById('parallelFr').innerHTML = '<em style="color:#aaa">Traduction en cours...</em>';
  document.getElementById('parallelHe').innerHTML = '';
  try {
    const response = await fetch('/api/translate', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ texte, type: 'traduction_complete' })
    });
    const data = await response.json();
    console.log(data);
    if (data.error) throw new Error(data.error);
    segmentsData = data.segments;
    if (!segmentsData || !Array.isArray(segmentsData)) throw new Error('Format de réponse invalide');
    renderParallel(segmentsData);
    traductionChargee = true;
  } catch (err) {
    document.getElementById('parallelFr').innerHTML = '<em style="color:red">Erreur : ' + err.message + '</em>';
  }
}

function intervertirColonnes() {
  colonnesInverties = !colonnesInverties;
  const parallelView = document.getElementById('parallelView');
  const colHe = document.getElementById('parallelHe');
  const colFr = document.getElementById('parallelFr');
  const separator = document.querySelector('.parallel-separator');
  if (colonnesInverties) {
    parallelView.append(colFr, separator, colHe);
  } else {
    parallelView.append(colHe, separator, colFr);
  }
}

async function basculerTraduction() {
  const btn = document.getElementById('btnTraduction');
  const output = document.getElementById('output');
  const parallelView = document.getElementById('parallelView');
  const detailBar = document.getElementById('detailBar');

  if (!modeTraduction) {
    modeTraduction = true;
    btn.textContent = 'Original';
    const texteHebreu = output.innerText;
    output.style.display = 'none';
    fermerPanel();
    document.body.classList.add('mode-parallele');
    document.documentElement.classList.add('mode-parallele');

    const mots = texteHebreu.trim().split(/\s+/);
    if (mots.length > 150) {
      portions = decoupeTexte(texteHebreu);
      portionActive = 0;
      afficherBoutonsPortion();
      afficherPopup('Ce texte a été découpé en ' + portions.length + ' parties de 200 mots maximum. Utilise les boutons Partie 1, 2... pour naviguer.');
      await lancerTraduction(portions[0]);
    } else {
      portions = [texteHebreu];
      portionActive = 0;
      await lancerTraduction(texteHebreu);
    }

  } else {
    modeTraduction = false;
    btn.textContent = 'Traduction';
    output.style.display = '';
    parallelView.classList.remove('visible');
    parallelView.style.top = '';
    parallelView.style.left = '';
    parallelView.style.right = '';
    parallelView.style.borderRadius = '';
    document.body.classList.remove('mode-parallele');
    document.documentElement.classList.remove('mode-parallele');
    detailBar.classList.remove('visible');
    document.getElementById('portionsNav').classList.remove('visible');
    portions = [];
  }
}

function nouveauTexte() {
  document.getElementById('inputCard').style.display = 'block';
  document.getElementById('textCard').classList.remove('visible');
  document.getElementById('input').value = '';
  document.getElementById('output').innerHTML = '';

  document.getElementById('translationText').innerHTML = '';

  modeTraduction = false;
  document.getElementById('btnTraduction').textContent = 'Traduction';
  segmentsData = null;
  motDetailCourant = null;
  document.getElementById('parallelView').classList.remove('visible');
  document.getElementById('detailBar').classList.remove('visible');
  document.getElementById('parallelHe').innerHTML = '';
  document.getElementById('parallelFr').innerHTML = '';
  document.body.classList.remove('mode-parallele');
  document.documentElement.classList.remove('mode-parallele');
  document.getElementById('parallelView').style.top = '';
  document.getElementById('parallelView').style.left = '';
  document.getElementById('parallelView').style.right = '';

}
  function fermerPanel() {
    document.getElementById('sidePanel').classList.remove('open');
    if (motActif) motActif.classList.remove('active');
    motActif = null;
  }

  function fermerPanelConj() {
    document.getElementById('conjPanel').classList.remove('open');

  async function afficherConjugaisons(infinitif) {
    const panel = document.getElementById('conjPanel');
    document.getElementById('conj-infinitif').textContent = infinitif;
    document.getElementById('conj-contenu').innerHTML = '<div class="panel-loading">Chargement des conjugaisons...</div>';
    panel.classList.add('open');

    try {
      const response = await fetch('/api/conjugaison', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ verbe: infinitif })
      });
      const data = await response.json();
      if (data.error) throw new Error(data.error);

      const pronoms = [
        { key: 'ani',    lm: 'אני / Je',        lf: 'אני / Je',        m: 'ani_m',     f: 'ani_f' },
        { key: 'ata_at', lm: 'אתה / Tu (m)',     lf: 'את / Tu (f)',     m: 'ata',       f: 'at' },
        { key: 'hou_hi', lm: 'הוא / Il',         lf: 'היא / Elle',      m: 'hou',       f: 'hi' },
        { key: 'anah',   lm: 'אנחנו / Nous',     lf: 'אנחנו / Nous',    m: 'anahnou_m', f: 'anahnou_f' },
        { key: 'atem',   lm: 'אתם / Vous (m)',   lf: 'אתן / Vous (f)',  m: 'atem',      f: 'aten' },
        { key: 'hem',    lm: 'הם / Ils',         lf: 'הן / Elles',      m: 'hem',       f: 'hen' },
      ];

      function buildTable(temps) {
        const rows = pronoms.map(p => `
          <tr>
            <td class="conj-f">${temps[p.f] || ''}</td>
            <td class="conj-m">${temps[p.m] || ''}</td>
            <td class="conj-pronoun">${p.lm}<br><span class="conj-pronoun-f">${p.lf}</span></td>
          </tr>`).join('');
        return `<table class="conj-table">
          <thead><tr><th>Féminin / נקבה</th><th>Masculin / זכר</th><th></th></tr></thead>
          <tbody>${rows}</tbody>
        </table>`;
      }

      document.getElementById('conj-contenu').innerHTML = `
        <div class="conj-section-title">Présent / הווה</div>
        ${buildTable(data.present)}
        <div class="conj-section-title">Passé / עבר</div>
        ${buildTable(data.passe)}
        <div class="conj-section-title">Futur / עתיד</div>
        ${buildTable(data.futur)}
      `;
    } catch (err) {
      document.getElementById('conj-contenu').innerHTML =
        `<div class="panel-loading">❌ Erreur : ${err.message}</div>`;
    }
  }

function renderParallel(segments) {
  let heHtml = '';
  let frHtml = '';
  segments.forEach((seg, i) => {
    if (seg.he === '\n' || seg.fr === '\n') {
      heHtml += '<br>';
      frHtml += '<br>';
    } else {
      heHtml += '<span class="seg" data-idx="' + i + '" onclick="surlignerSegment(' + i + ', \'he\')">' + seg.he + '</span> ';
      frHtml += '<span class="seg" data-idx="' + i + '" onclick="surlignerSegment(' + i + ', \'fr\')">' + seg.fr + '</span> ';
    }
  });
  document.getElementById('parallelHe').innerHTML = heHtml;
  document.getElementById('parallelFr').innerHTML = frHtml;
}

function surlignerSegment(idx, col) {
  document.querySelectorAll('.seg').forEach(el => el.classList.remove('hl-primary', 'hl-echo'));
  document.querySelectorAll('.seg[data-idx="' + idx + '"]').forEach(el => {
    const dansColCliquee = el.closest('.col-' + col) !== null;
    el.classList.add(dansColCliquee ? 'hl-primary' : 'hl-echo');
  });
  if (segmentsData && segmentsData[idx]) motDetailCourant = segmentsData[idx].he;
  document.getElementById('detailBar').classList.add('visible');

  ['parallelHe', 'parallelFr'].forEach(colId => {
    const colEl = document.getElementById(colId);
    const hl = colEl.querySelector('.hl-primary, .hl-echo');
    if (!hl) return;
    const colRect = colEl.getBoundingClientRect();
    const hlRect = hl.getBoundingClientRect();
    const hlCenter = hlRect.top - colRect.top + colEl.scrollTop + hlRect.height / 2;
    colEl.scrollTop = hlCenter - colEl.clientHeight / 2;
  });
}

async function ouvrirDetail() {
  if (!motDetailCourant) return;
  document.getElementById('panel-mot').textContent = motDetailCourant;
  document.getElementById('panel-traduction').textContent = '';
  document.getElementById('panel-badges').innerHTML = '';
  document.getElementById('panel-contenu').innerHTML = '<div class="panel-loading">Analyse en cours...</div>';
  document.getElementById('btnStar').style.display = 'none';
  favoriId = null;
  document.getElementById('sidePanel').classList.add('open');
  const texteComplet = document.getElementById('parallelHe').innerText;
  try {
    const response = await fetch('/api/translate', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ mot: motDetailCourant, texte: texteComplet, type: 'mot' })
    });
    const data = await response.json();
    const texteReponse = data.content[0].text.replace(/```json|```/g, '').trim();
    const json = JSON.parse(texteReponse);
    document.getElementById('panel-traduction').textContent = json.traduction;
    document.getElementById('panel-badges').innerHTML = json.badges.map(b => '<span class="badge">' + b + '</span>').join('');
    const btnConj = json.estVerbe && json.infinitif ? '<button class="btn-conjugaison" onclick="afficherConjugaisons(\'' + json.infinitif.replace(/'/g, "\\'") + '\')"><i class="ti ti-layout-grid"></i> Conjugaisons →</button>' : '';
    const niqqud = json.motAvecNiqqud ? '<div class="panel-niqqud">' + json.motAvecNiqqud + '</div><div class="divider"></div>' : '';
    document.getElementById('panel-contenu').innerHTML = niqqud + '<div class="panel-label">Racine</div><div class="panel-val">' + json.racine + '</div><div class="panel-label">Analyse</div><div class="panel-val">' + json.analyse + '</div>' + btnConj;

    document.getElementById('btnStar').style.display = '';
    detailCourant = { mot: motDetailCourant, traduction: json.traduction, racine: json.racine };
    _chargerFavori(motDetailCourant);
    _ajouterHistorique(motDetailCourant, json.traduction);
  } catch (err) {
    document.getElementById('panel-contenu').innerHTML = '<div class="panel-loading">❌ Erreur : ' + err.message + '</div>';
  }
}

function afficherPopup(msg) {
  document.getElementById('popupMsg').textContent = msg;
  document.getElementById('popupOverlay').classList.add('visible');
}
function fermerPopup() {
  document.getElementById('popupOverlay').classList.remove('visible');
}

function prononcerMot() {
  const mot = document.getElementById('panel-mot').textContent.trim();
  if (!mot || !window.speechSynthesis) return;
  const utt = new SpeechSynthesisUtterance(mot);
  utt.lang = 'he-IL';
  window.speechSynthesis.cancel();
  window.speechSynthesis.speak(utt);
}

// ── FAVORIS & HISTORIQUE ──────────────────────────────────────────────────────

async function _chargerFavori(mot) {
  favoriId = null;
  _syncEtoile();
  const { data: { user } } = await supabaseClient.auth.getUser();
  if (!user) return;
  const { data } = await supabaseClient.from('favoris')
    .select('id')
    .eq('mot_hebreu', mot)
    .eq('user_id', user.id)
    .maybeSingle();
  favoriId = data?.id ?? null;
  _syncEtoile();
}

function _syncEtoile() {
  const btn = document.getElementById('btnStar');
  if (!btn) return;
  btn.textContent = favoriId ? '★' : '☆';
  btn.classList.toggle('active', !!favoriId);
  btn.title = favoriId ? 'Retirer des favoris' : 'Ajouter aux favoris';
}

async function basculerFavori() {
  const { data: { user } } = await supabaseClient.auth.getUser();
  if (!user) { ouvrirModalAuth(); return; }
  if (!detailCourant) return;
  if (favoriId) {
    await supabaseClient.from('favoris').delete().eq('id', favoriId);
    favoriId = null;
  } else {
    const { data } = await supabaseClient.from('favoris')
      .insert({ mot_hebreu: detailCourant.mot, traduction: detailCourant.traduction, racine: detailCourant.racine, user_id: user.id })
      .select('id')
      .single();
    favoriId = data?.id ?? null;
  }
  _syncEtoile();
}

async function _ajouterHistorique(mot, traduction) {
  const { data: { user } } = await supabaseClient.auth.getUser();
  if (!user) return;
  await supabaseClient.from('historique').insert({ mot_hebreu: mot, traduction, user_id: user.id });
}

// ── AUTH ──────────────────────────────────────────────────────────────────────

let authMode = 'login';

function ouvrirModalAuth() {
  authMode = 'login';
  _syncModale();
  document.getElementById('authEmail').value = '';
  document.getElementById('authPassword').value = '';
  document.getElementById('authMsg').textContent = '';
  document.getElementById('authMsg').className = 'auth-msg';
  document.getElementById('authModalOverlay').classList.add('visible');
  setTimeout(() => document.getElementById('authEmail').focus(), 50);
}

function fermerModalAuth() {
  document.getElementById('authModalOverlay').classList.remove('visible');
}

function basculerModeAuth() {
  authMode = authMode === 'login' ? 'signup' : 'login';
  _syncModale();
  document.getElementById('authMsg').textContent = '';
  document.getElementById('authMsg').className = 'auth-msg';
}

function _syncModale() {
  const login = authMode === 'login';
  document.getElementById('authTitle').textContent = login ? 'Se connecter' : 'Créer un compte';
  document.getElementById('authSubtitle').textContent = login
    ? 'Accédez à vos favoris et votre historique.'
    : 'Créez votre compte pour sauvegarder vos mots.';
  document.getElementById('authSubmitBtn').textContent = login ? 'Se connecter' : 'Créer mon compte';
  document.getElementById('authToggle').innerHTML = login
    ? 'Pas encore de compte ? <a href="#" onclick="basculerModeAuth();return false;">Créer un compte</a>'
    : 'Déjà un compte ? <a href="#" onclick="basculerModeAuth();return false;">Se connecter</a>';
}

async function soumettreAuth() {
  const email = document.getElementById('authEmail').value.trim();
  const password = document.getElementById('authPassword').value;
  const msgEl = document.getElementById('authMsg');
  const btn = document.getElementById('authSubmitBtn');

  if (!email || !password) {
    msgEl.className = 'auth-msg error';
    msgEl.textContent = 'Email et mot de passe requis.';
    return;
  }

  btn.disabled = true;
  btn.textContent = '…';
  msgEl.textContent = '';

  const isSignup = authMode === 'signup';
  const { error } = isSignup
    ? await supabaseClient.auth.signUp({ email, password })
    : await supabaseClient.auth.signInWithPassword({ email, password });

  btn.disabled = false;
  _syncModale();

  if (error) {
    msgEl.className = 'auth-msg error';
    msgEl.textContent = _traduireErreurAuth(error.message);
    return;
  }

  if (isSignup) {
    msgEl.className = 'auth-msg success';
    msgEl.textContent = 'Compte créé ! Vérifiez votre email pour confirmer.';
    return;
  }

  fermerModalAuth();
}

function _traduireErreurAuth(msg) {
  if (msg.includes('Invalid login credentials')) return 'Email ou mot de passe incorrect.';
  if (msg.includes('Email not confirmed')) return 'Confirmez votre email avant de vous connecter.';
  if (msg.includes('User already registered')) return 'Un compte existe déjà avec cet email.';
  if (msg.includes('Password should be at least')) return 'Le mot de passe doit faire au moins 6 caractères.';
  return msg;
}

async function seDeconnecter() {
  await supabaseClient.auth.signOut();
}

function _mettreAJourHeaderAuth(user) {
  const btnConnexion = document.getElementById('btnConnexion');
  const userChip = document.getElementById('userChip');
  if (user) {
    btnConnexion.style.display = 'none';
    userChip.style.display = 'flex';
    document.getElementById('userEmail').textContent = user.email;
  } else {
    btnConnexion.style.display = '';
    userChip.style.display = 'none';
  }
}

supabaseClient.auth.onAuthStateChange((_event, session) => {
  _mettreAJourHeaderAuth(session?.user ?? null);
});

    <div class="auth-field">
      <label for="authEmail">Email</label>
      <input type="email" id="authEmail" placeholder="vous@email.com" onkeydown="if(event.key==='Enter')soumettreAuth()">
    </div>
    <div class="auth-field">
      <label for="authPassword">Mot de passe</label>
      <input type="password" id="authPassword" placeholder="••••••••" onkeydown="if(event.key==='Enter')soumettreAuth()">
    </div>
    <div class="auth-msg" id="authMsg"></div>
    <button class="auth-submit" id="authSubmitBtn" onclick="soumettreAuth()">Se connecter</button>
    <div class="auth-toggle" id="authToggle">
      Pas encore de compte ? <a href="#" onclick="basculerModeAuth();return false;">Créer un compte</a>
    </div>
  </div>
</div>

<div class="popup-overlay" id="popupOverlay">
  <div class="popup-card">
    <div class="popup-title">Texte trop long</div>
    <div class="popup-msg" id="popupMsg"></div>
    <button class="popup-btn" onclick="fermerPopup()">OK</button>
  </div>
</div>

</body>
</html>
