<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lamed — Apprendre l'hébreu</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: Arial, sans-serif;
      background: #f5f5f3;

    }
    body.mode-parallele { overflow: hidden; }

    /* TOPBAR */

    .pill {
      font-size: 13px;

      color: #888;

      background: transparent;

    /* LAYOUT PRINCIPAL */

    /* CARTE SAISIE */

    }

    .btn-primary {

    }

  display: flex;

}
.btn-secondary {

.translation-text.visible { display: block; }
    .he-text {

      margin-bottom: 8px;

    .conj-table th {

      color: #aaa;

    @media (max-width: 700px) {
      .conj-panel {
        top: 0; left: 0; right: 0; bottom: 0;
        width: 100%;
        border-radius: 0;
      }
    }

    /* CLÉ API */
    .api-bar {
      background: #fffdf0;
      border: 1px solid #ffe082;
      border-radius: 8px;
      padding: 10px 14px;
      margin-bottom: 16px;

      align-items: center;

    }
    .api-bar label { font-size: 12px; color: #aaa; white-space: nowrap; }

    /* RESPONSIVE */
    @media (max-width: 700px) {
  .layout { flex-direction: column; padding: 16px; }
  .side-panel {
    position: fixed;
    top: 0; left: 0;
    width: 100% !important;
    height: 100%;
    background: rgba(0,0,0,0.4);
    z-index: 50;
    overflow: hidden;
    display: none;
  }
  .side-panel.open {
    display: flex;
    align-items: flex-end;
  }
  .panel-card {
    width: 100%;
    max-height: 85vh;
    overflow-y: auto;
    border-radius: 16px 16px 0 0;
    position: static;
    border-bottom: none;
  }
}
    .parallel-view { display: none; }
    .parallel-view.visible { display: flex; flex-direction: row; position: fixed; top: 57px; left: 0; right: 0; bottom: 0; z-index: 5; background: white; }
    .parallel-col { flex: 1; padding: 16px; min-width: 0; font-size: 18px; line-height: 1.8; overflow-y: auto; }
    .parallel-col.col-he { border-left: 1px solid #e8e8e8; direction: rtl; text-align: right; }
    .parallel-separator { display: none; }
    .parallel-col.col-fr { direction: ltr; color: #444; }
    .seg { cursor: pointer; border-radius: 3px; padding: 1px 3px; transition: background 0.15s; display: inline; }
    .seg:hover { background: #f0f0ee; }
    .seg.hl-primary { background: #faeeda; outline: 1px solid #ba7517; }
    .seg.hl-echo { background: #ede9f8; outline: 1px solid #7c3aed; }
    .detail-bar { display: none; position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%); z-index: 300; }
    .detail-bar.visible { display: block; }

    }
  </style>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/mammoth/1.6.0/mammoth.browser.min.js"></script>
</head>
<body>

<div class="topbar">
  <div class="logo">
    <span class="logo-he">לָמַד</span>
    <span>Lamed</span>
  </div>
  <div class="nav-pills">
    <button class="pill active">Lire</button>
    <button class="pill">Historique</button>
</div>
</div>

<div class="layout" id="layout">

  <div class="main">



    <!-- Zone de saisie — disparaît après analyse -->
    <div class="input-card" id="inputCard">
      <div class="input-label">Colle ton texte hébreu</div>
      <textarea id="input" placeholder="הדבק כאן טקסט בעברית..."></textarea>
      <div class="btn-row">
        <input type="file" id="photoInput" accept=".jpg,.jpeg,.png,.pdf,.docx" style="display:none" onchange="ocrPhoto(this)">
        <button class="btn-photo" onclick="document.getElementById('photoInput').click()">Importer</button>
        <button class="btn-primary" onclick="afficherTexte()" style="margin-left:8px">Analyser le texte ▶</button>
      </div>
      <div class="analyse-spinner" id="analyseSpinner">
        <div class="spinner-ring"></div>
        <span id="analyseSpinnerLabel">Analyse en cours...</span>
      </div>
    </div>

    <!-- Texte cliquable — remplace la saisie -->
    <div class="text-card" id="textCard">
  <div class="text-toolbar">
    <button class="btn-secondary" id="btnTraduction" onclick="basculerTraduction()">Traduction</button>
    <button class="btn-secondary" onclick="nouveauTexte()">Nouveau texte</button>
  </div>
  <div class="detail-bar" id="detailBar">
    <button class="btn-detail" onclick="ouvrirDetail()">🔍 Détail</button>
  </div>
  <div class="parallel-view" id="parallelView">
    <div class="parallel-col col-fr" id="parallelFr"></div>
    <div class="parallel-separator"></div>
    <div class="parallel-col col-he" id="parallelHe"></div>
  </div>
  <div class="he-text" id="output"></div>
  <div class="translation-text" id="translationText"></div>
</div>

  </div>

  <!-- Panneau latéral -->
  <div class="side-panel" id="sidePanel">
    <div class="panel-card">
      <button class="panel-close" onclick="fermerPanel()">✕</button>
      <div class="panel-he" id="panel-mot"></div>
      <div class="panel-fr" id="panel-traduction"></div>
      <div class="badges" id="panel-badges"></div>
      <div class="divider"></div>
      <div id="panel-contenu"></div>
    </div>
  </div>

</div>

<!-- Panneau conjugaisons (par-dessus) -->
<div class="conj-panel" id="conjPanel">
  <button class="panel-close" onclick="fermerPanelConj()">✕</button>
  <div class="conj-infinitif" id="conj-infinitif"></div>
  <div id="conj-contenu"><div class="panel-loading">Chargement des conjugaisons...</div></div>
</div>

<script>
  let motActif = null;
  let segmentsData = null;
  let motDetailCourant = null;

  async function ocrPhoto(input) {
    const file = input.files[0];
    if (!file) return;
    input.value = '';

    const textarea = document.getElementById('input');
    textarea.value = '';
    textarea.disabled = true;
    document.getElementById('analyseSpinnerLabel').textContent = 'Lecture du fichier en cours...';
    document.getElementById('analyseSpinner').classList.add('visible');

    const isDocx = file.name.endsWith('.docx') ||
      file.type === 'application/vnd.openxmlformats-officedocument.wordprocessingml.document';

    try {
      if (isDocx) {
        const arrayBuffer = await file.arrayBuffer();
        const result = await mammoth.extractRawText({ arrayBuffer });
        textarea.value = result.value;
      } else {
        const mediaType = file.type || (file.name.endsWith('.pdf') ? 'application/pdf' : 'image/jpeg');
        const base64 = await new Promise((resolve, reject) => {
          const reader = new FileReader();
          reader.onload = e => resolve(e.target.result.split(',')[1]);
          reader.onerror = reject;
          reader.readAsDataURL(file);
        });
        const res = await fetch('/api/ocr', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ image: base64, mediaType })
        });
        const data = await res.json();
        if (data.error) throw new Error(data.error);
        textarea.value = data.texte.replace(/\\n/g, '\n');
      }
    } catch (err) {
      textarea.value = '';
      alert('Erreur lors de la lecture : ' + err.message);
    } finally {
      textarea.disabled = false;
      textarea.focus();
      document.getElementById('analyseSpinner').classList.remove('visible');
    }
  }

  function afficherTexte() {
    const texte = document.getElementById('input').value.trim();
    if (!texte) return;

    document.getElementById('analyseSpinnerLabel').textContent = 'Analyse en cours...';
    document.getElementById('analyseSpinner').classList.add('visible');

    requestAnimationFrame(() => {
      // Nettoie les niqqoud
      const textePropre = texte.replace(/[\u0591-\u05C7]/g, '');
      const lignes = textePropre.split(/\n/);

      const output = document.getElementById('output');
      output.innerHTML = lignes.map(ligne => {
        const mots = ligne.trim().split(/\s+/).filter(m => m);
        if (!mots.length) return '<br>';
        return mots.map(mot =>
          `<span class="word" onclick="traduire(this, '${mot.replace(/'/g, "\\'")}')">${mot}</span>`
        ).join(' ');
      }).join('<br>');

      document.getElementById('analyseSpinner').classList.remove('visible');
      document.getElementById('inputCard').style.display = 'none';
      document.getElementById('textCard').classList.add('visible');
    });
  }

  async function traduire(el, mot) {
    if (motActif) motActif.classList.remove('active');
    motActif = el;
    el.classList.add('active');

    // Ouvre le panneau
    document.getElementById('panel-mot').textContent = mot;
    document.getElementById('panel-traduction').textContent = '';
    document.getElementById('panel-badges').innerHTML = '';
    document.getElementById('panel-contenu').innerHTML = '<div class="panel-loading">Analyse en cours...</div>';
    document.getElementById('sidePanel').classList.add('open');

    const texteComplet = document.getElementById('output').innerText;

    try {
      const response = await fetch('/api/translate', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ mot, texte: texteComplet, type: 'mot' })
      });

      const data = await response.json();
      const texteReponse = data.content[0].text.replace(/```json|```/g, '').trim();
      const json = JSON.parse(texteReponse);

      document.getElementById('panel-traduction').textContent = json.traduction;

      document.getElementById('panel-badges').innerHTML = json.badges
        .map(b => `<span class="badge">${b}</span>`).join('');

      const btnConj = json.estVerbe && json.infinitif
        ? `<button class="btn-conjugaison" onclick="afficherConjugaisons('${json.infinitif.replace(/'/g, "\\'")}')">📊 Conjugaisons →</button>`
        : '';

      const niqqud = json.motAvecNiqqud
        ? `<div class="panel-niqqud">${json.motAvecNiqqud}</div><div class="divider"></div>`
        : '';

      document.getElementById('panel-contenu').innerHTML = `
        ${niqqud}
        <div class="panel-label">Racine</div>
        <div class="panel-val">${json.racine}</div>
        <div class="panel-label">Analyse</div>
        <div class="panel-val">${json.analyse}</div>
        ${btnConj}
      `;

    } catch (err) {
      document.getElementById('panel-contenu').innerHTML =
        `<div class="panel-loading">❌ Erreur : ${err.message}</div>`;
    }
  }
let traductionChargee = false;
let modeTraduction = false;

async function basculerTraduction() {
  const btn = document.getElementById('btnTraduction');
  const output = document.getElementById('output');
  const parallelView = document.getElementById('parallelView');
  const detailBar = document.getElementById('detailBar');
  if (!modeTraduction) {
    modeTraduction = true;
    btn.textContent = 'Original';
    const texteHebreu = output.innerText;
    output.style.display = 'none';
    fermerPanel();
    document.body.classList.add('mode-parallele');
    if (!traductionChargee) {
      parallelView.classList.add('visible');
      const topbarH = document.querySelector('.topbar').offsetHeight;
      const toolbarH = document.querySelector('.text-toolbar').offsetHeight;
      parallelView.style.top = (topbarH + toolbarH + 8) + 'px';
      document.getElementById('parallelFr').innerHTML = '<em style="color:#aaa">Traduction en cours...</em>';
      document.getElementById('parallelHe').innerHTML = '';
      try {
        const response = await fetch('/api/translate', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ texte: texteHebreu, type: 'traduction_complete' })
        });
        const data = await response.json();
        segmentsData = data.segments;
        renderParallel(segmentsData);
        traductionChargee = true;
      } catch (err) {
        document.getElementById('parallelFr').innerHTML = '<em style="color:red">Erreur : ' + err.message + '</em>';
      }
    } else {
      parallelView.classList.add('visible');
      const topbarH = document.querySelector('.topbar').offsetHeight;
      const toolbarH = document.querySelector('.text-toolbar').offsetHeight;
      parallelView.style.top = (topbarH + toolbarH + 8) + 'px';
    }
  } else {
    modeTraduction = false;
    btn.textContent = 'Traduction';
    output.style.display = '';
    parallelView.classList.remove('visible');
    parallelView.style.top = '';
    document.body.classList.remove('mode-parallele');
    detailBar.classList.remove('visible');
  }
}

function nouveauTexte() {
  document.getElementById('inputCard').style.display = 'block';
  document.getElementById('textCard').classList.remove('visible');
  document.getElementById('input').value = '';
  document.getElementById('output').innerHTML = '';
  document.getElementById('translationText').innerHTML = '';
  traductionChargee = false;
  modeTraduction = false;
  document.getElementById('btnTraduction').textContent = 'Traduction';
  segmentsData = null;
  motDetailCourant = null;
  document.getElementById('parallelView').classList.remove('visible');
  document.getElementById('detailBar').classList.remove('visible');
  document.getElementById('parallelHe').innerHTML = '';
  document.getElementById('parallelFr').innerHTML = '';
  fermerPanel();
}
  function fermerPanel() {
    document.getElementById('sidePanel').classList.remove('open');
    if (motActif) motActif.classList.remove('active');
    motActif = null;
  }

  function fermerPanelConj() {
    document.getElementById('conjPanel').classList.remove('open');
  }

  async function afficherConjugaisons(infinitif) {
    const panel = document.getElementById('conjPanel');
    document.getElementById('conj-infinitif').textContent = infinitif;
    document.getElementById('conj-contenu').innerHTML = '<div class="panel-loading">Chargement des conjugaisons...</div>';
    panel.classList.add('open');

    try {
      const response = await fetch('/api/conjugaison', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ verbe: infinitif })
      });
      const data = await response.json();
      if (data.error) throw new Error(data.error);

      const pronoms = [
        { key: 'ani',    lm: 'אני / Je',        lf: 'אני / Je',        m: 'ani_m',     f: 'ani_f' },
        { key: 'ata_at', lm: 'אתה / Tu (m)',     lf: 'את / Tu (f)',     m: 'ata',       f: 'at' },
        { key: 'hou_hi', lm: 'הוא / Il',         lf: 'היא / Elle',      m: 'hou',       f: 'hi' },
        { key: 'anah',   lm: 'אנחנו / Nous',     lf: 'אנחנו / Nous',    m: 'anahnou_m', f: 'anahnou_f' },
        { key: 'atem',   lm: 'אתם / Vous (m)',   lf: 'אתן / Vous (f)',  m: 'atem',      f: 'aten' },
        { key: 'hem',    lm: 'הם / Ils',         lf: 'הן / Elles',      m: 'hem',       f: 'hen' },
      ];

      function buildTable(temps) {
        const rows = pronoms.map(p => `
          <tr>
            <td class="conj-f">${temps[p.f] || ''}</td>
            <td class="conj-m">${temps[p.m] || ''}</td>
            <td class="conj-pronoun">${p.lm}<br><span class="conj-pronoun-f">${p.lf}</span></td>
          </tr>`).join('');
        return `<table class="conj-table">
          <thead><tr><th>Féminin / נקבה</th><th>Masculin / זכר</th><th></th></tr></thead>
          <tbody>${rows}</tbody>
        </table>`;
      }

      document.getElementById('conj-contenu').innerHTML = `
        <div class="conj-section-title">Présent / הווה</div>
        ${buildTable(data.present)}
        <div class="conj-section-title">Passé / עבר</div>
        ${buildTable(data.passe)}
        <div class="conj-section-title">Futur / עתיד</div>
        ${buildTable(data.futur)}
      `;
    } catch (err) {
      document.getElementById('conj-contenu').innerHTML =
        `<div class="panel-loading">❌ Erreur : ${err.message}</div>`;
    }
  }

function renderParallel(segments) {
  let heHtml = '';
  let frHtml = '';
  segments.forEach((seg, i) => {
    if (seg.he === '\n' || seg.fr === '\n') {
      heHtml += '<br>';
      frHtml += '<br>';
    } else {
      heHtml += '<span class="seg" data-idx="' + i + '" onclick="surlignerSegment(' + i + ', \'he\')">' + seg.he + '</span> ';
      frHtml += '<span class="seg" data-idx="' + i + '" onclick="surlignerSegment(' + i + ', \'fr\')">' + seg.fr + '</span> ';
    }
  });
  document.getElementById('parallelHe').innerHTML = heHtml;
  document.getElementById('parallelFr').innerHTML = frHtml;
}

function surlignerSegment(idx, col) {
  document.querySelectorAll('.seg').forEach(el => el.classList.remove('hl-primary', 'hl-echo'));
  document.querySelectorAll('.seg[data-idx="' + idx + '"]').forEach(el => {
    const dansColCliquee = el.closest('.col-' + col) !== null;
    el.classList.add(dansColCliquee ? 'hl-primary' : 'hl-echo');
  });
  if (segmentsData && segmentsData[idx]) motDetailCourant = segmentsData[idx].he;
  document.getElementById('detailBar').classList.add('visible');

  ['parallelHe', 'parallelFr'].forEach(colId => {
    const colEl = document.getElementById(colId);
    const hl = colEl.querySelector('.hl-primary, .hl-echo');
    if (!hl) return;
    const colRect = colEl.getBoundingClientRect();
    const hlRect = hl.getBoundingClientRect();
    const hlCenter = hlRect.top - colRect.top + colEl.scrollTop + hlRect.height / 2;
    colEl.scrollTop = hlCenter - colEl.clientHeight / 2;
  });
}

async function ouvrirDetail() {
  if (!motDetailCourant) return;
  document.getElementById('panel-mot').textContent = motDetailCourant;
  document.getElementById('panel-traduction').textContent = '';
  document.getElementById('panel-badges').innerHTML = '';
  document.getElementById('panel-contenu').innerHTML = '<div class="panel-loading">Analyse en cours...</div>';
  document.getElementById('sidePanel').classList.add('open');
  const texteComplet = document.getElementById('parallelHe').innerText;
  try {
    const response = await fetch('/api/translate', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ mot: motDetailCourant, texte: texteComplet, type: 'mot' })
    });
    const data = await response.json();
    const texteReponse = data.content[0].text.replace(/```json|```/g, '').trim();
    const json = JSON.parse(texteReponse);
    document.getElementById('panel-traduction').textContent = json.traduction;
    document.getElementById('panel-badges').innerHTML = json.badges.map(b => '<span class="badge">' + b + '</span>').join('');
    const btnConj = json.estVerbe && json.infinitif ? '<button class="btn-conjugaison" onclick="afficherConjugaisons(\'' + json.infinitif.replace(/'/g, "\\'") + '\')">📊 Conjugaisons →</button>' : '';
    const niqqud = json.motAvecNiqqud ? '<div class="panel-niqqud">' + json.motAvecNiqqud + '</div><div class="divider"></div>' : '';
    document.getElementById('panel-contenu').innerHTML = niqqud + '<div class="panel-label">Racine</div><div class="panel-val">' + json.racine + '</div><div class="panel-label">Analyse</div><div class="panel-val">' + json.analyse + '</div>' + btnConj;
  } catch (err) {
    document.getElementById('panel-contenu').innerHTML = '<div class="panel-loading">❌ Erreur : ' + err.message + '</div>';
  }
}

</script>
